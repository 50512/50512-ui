<!doctype html>
<html lang="es-419">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>50512.dev — assets de marca</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #e9ecef;
        color: #1a1f24;
        font:
          16px/1.55 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      p.lead {
        color: #6b747d;
        margin: 0 0 32px;
        font-size: 14px;
      }
      section {
        margin-bottom: 32px;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b747d;
        margin: 0 0 12px;
        font-family: ui-monospace, monospace;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font:
          11px/1.35 ui-monospace,
          monospace;
        color: #6b747d;
        margin-top: 8px;
        letter-spacing: 0.06em;
      }
      .checker {
        background-image:
          linear-gradient(45deg, #c5ccd3 25%, transparent 25%),
          linear-gradient(-45deg, #c5ccd3 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #c5ccd3 75%),
          linear-gradient(-45deg, transparent 75%, #c5ccd3 75%);
        background-size: 16px 16px;
        background-position:
          0 0,
          0 8px,
          8px -8px,
          -8px 0;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <h1>50512.dev — assets de marca</h1>
    <p class="lead">
      Generado por <code>scripts/build-brand.mjs</code>. No editar a mano.
    </p>

    <section>
      <h2>SVG (tamano intrinseco)</h2>
      <div class="row checker">
        <figure>
          <img src="svg/banner.svg" alt="banner" />
          <figcaption>banner.svg</figcaption>
        </figure>
        <figure>
          <img src="svg/portrait.svg" alt="portrait" />
          <figcaption>portrait.svg</figcaption>
        </figure>
        <figure>
          <img src="svg/square.svg" alt="square" />
          <figcaption>square.svg</figcaption>
        </figure>
        <figure>
          <img src="svg/square-status.svg" alt="square-status" />
          <figcaption>square-status.svg</figcaption>
        </figure>
        <figure>
          <img src="svg/small.svg" alt="small" />
          <figcaption>small.svg</figcaption>
        </figure>
        <figure>
          <img src="svg/small-status.svg" alt="small-status" />
          <figcaption>small-status.svg</figcaption>
        </figure>
        <figure>
          <img src="svg/mark.svg" alt="mark" />
          <figcaption>mark.svg</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <h2>Favicon a tamano real</h2>
      <div class="row" style="align-items: center">
        <figure>
          <img src="png/mark@1x.png" width="16" height="16" alt="16px" />
          <figcaption>16px</figcaption>
        </figure>
        <figure>
          <img src="png/mark@1x.png" width="32" height="32" alt="32px" />
          <figcaption>32px</figcaption>
        </figure>
        <figure>
          <img src="png/mark@1x.png" width="48" height="48" alt="48px" />
          <figcaption>48px</figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
