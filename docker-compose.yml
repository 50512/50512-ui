services:
  caddy:
    image: caddy:2.11-alpine
    container_name: 50512-ui
    restart: unless-stopped
    ports:
      - 172.17.0.1:80:80
    volumes:
      - ./docker/caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - admin_admin_network
      - default

  astro-dev:
    image: node:22-alpine
    container_name: 50512-ui-kit
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install && rm -f .astro/dev.json && pnpm run dev --host 0.0.0.0"
    volumes:
      - ./:/app

networks:
  admin_admin_network:
    external: true

volumes:
  caddy_data:
  caddy_config:
